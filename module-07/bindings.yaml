apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: product-catalog-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: product-catalog-sa
  namespace: default
roleRef:
  kind: Role
  name: product-catalog-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: postgres-sa
  namespace: default
roleRef:
  kind: Role
  name: postgres-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-collector-clusterrolebinding
subjects:
- kind: ServiceAccount
  name: log-collector-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: log-collector-role
  apiGroup: rbac.authorization.k8s.io
