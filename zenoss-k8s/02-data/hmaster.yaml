# HMaster — Tier 02: Data
#
# Source: zenoss/hbase:24.0.8
# CC Command: /usr/bin/run-hbase-master.sh /etc/hbase-site.xml
# CC Instances: Min 1
# CC RAMCommitment: 1G
# CC Volume: /var/hbase (hbase.rootdir — where HBase stores all region data)
# CC Privileged: true
#
# Key translation decisions:
# - hbase-site.xml: CC hardcoded "zk1" as hbase.zookeeper.quorum.
#   We replace with real ClusterDNS: zookeeper.zenoss.svc.cluster.local
#   ConfigMap key: hbase-site.xml
# - hbase-env.sh: Sets HBASE_MANAGES_ZK=false and heap size.
#   CC computed heap from RAMCommitment (1G * 0.9 = 921MB).
#   We set HBASE_HEAPSIZE=921 directly. Injected via config-init initContainer.
# - REST API at :61000 is critical — used by RegionServer and OpenTSDB prereqs.
# - CC Prereq: "All ZooKeepers up" — check with echo ruok | nc zk1 2181 | grep imok
#   Translated to check zookeeper.zenoss.svc.cluster.local:2181
# - Hostname was set to "localhost" in CC — no stable hostname needed in Kubernetes,
#   pod uses its own stable DNS via StatefulSet.
# - /var/hbase is the HBase data directory (hbase.rootdir = file:///var/hbase)
#   This must be on a PVC — it holds all HBase table data.

---
apiVersion: v1
kind: Service
metadata:
  name: hmaster
  namespace: zenoss
  labels:
    app: hmaster
    tier: data
spec:
  selector:
    app: hmaster
  ports:
    - name: master
      port: 60000
      targetPort: 60000
    - name: web-ui
      port: 60010
      targetPort: 60010
    - name: rest
      port: 61000
      targetPort: 61000
  clusterIP: None   # Headless — stable per-pod DNS for HBase peer coordination

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hmaster-pdb
  namespace: zenoss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hmaster

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hmaster
  namespace: zenoss
  labels:
    app: hmaster
    tier: data
spec:
  serviceName: hmaster
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: hmaster
  template:
    metadata:
      labels:
        app: hmaster
        tier: data
    spec:
      securityContext:
        runAsUser: 0
      terminationGracePeriodSeconds: 60   # HBase master needs time to hand off regions

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: hmaster
                topologyKey: kubernetes.io/hostname

      initContainers:
        # Wait for ZooKeeper to be up and answering ruok before starting HBase.
        # CC Prereq: { echo ruok; sleep 1; } | nc zk1 2181 | grep imok
        - name: wait-for-zookeeper
          image: zenoss/hbase:24.0.8
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for ZooKeeper..."
              until { echo ruok; sleep 1; } | nc zookeeper.zenoss.svc.cluster.local 2181 | grep -q imok; do
                echo "ZooKeeper not ready, retrying in 5s..."
                sleep 5
              done
              echo "ZooKeeper is up."

        # Inject hbase-site.xml and hbase-env.sh from ConfigMap.
        # CC injected these as ConfigFiles via Go template rendering.
        # We write them to an emptyDir shared with the main container.
        - name: config-init
          image: zenoss/hbase:24.0.8
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Writing hbase-site.xml..."
              cp /config/hbase-site.xml /etc/hbase-site.xml
              chown hbase:hbase /etc/hbase-site.xml
              chmod 0664 /etc/hbase-site.xml

              echo "Writing hbase-env.sh..."
              cp /config/hbase-env.sh /etc/hbase-env.sh
              chown hbase:hbase /etc/hbase-env.sh
              chmod 0775 /etc/hbase-env.sh

              echo "Config files written."
              ls -la /etc/hbase-*
          volumeMounts:
            - name: config-source
              mountPath: /config
            - name: hbase-config
              mountPath: /etc

      containers:
        - name: hmaster
          image: zenoss/hbase:24.0.8
          # CC Command: /usr/bin/run-hbase-master.sh /etc/hbase-site.xml
          command: ["/usr/bin/run-hbase-master.sh", "/etc/hbase-site.xml"]
          securityContext:
            privileged: true    # CC Privileged: true
          resources:
            requests:
              memory: "1Gi"     # CC RAMCommitment: 1G
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          env:
            - name: HBASE_HEAPSIZE
              value: "921"      # 1G * 0.9 = 921MB, per CC hbase-env.sh template
          ports:
            - name: master
              containerPort: 60000
            - name: web-ui
              containerPort: 60010
            - name: rest
              containerPort: 61000
          volumeMounts:
            - name: data
              mountPath: /var/hbase
            - name: hbase-config
              mountPath: /etc/hbase-site.xml
              subPath: hbase-site.xml
            - name: hbase-config
              mountPath: /etc/hbase-env.sh
              subPath: hbase-env.sh
          readinessProbe:
            # CC HealthCheck rest_answering: curl http://127.0.0.1:61000/status/cluster
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -f -s http://127.0.0.1:61000/status/cluster > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            # CC HealthCheck cluster_healthy: curl ... | grep -q '0 dead'
            exec:
              command:
                - /bin/sh
                - -c
                - "curl -f -s http://127.0.0.1:61000/status/cluster > /dev/null"
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5

      volumes:
        - name: config-source
          configMap:
            name: zenoss-config
            items:
              - key: hbase-site.xml
                path: hbase-site.xml
              - key: hbase-env.sh
                path: hbase-env.sh
        - name: hbase-config
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi   # /var/hbase holds all HBase table data including
                            # OpenTSDB metrics tables — size generously
