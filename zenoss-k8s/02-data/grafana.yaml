# Grafana — Tier 02: Data
#
# Image: grafana/grafana:10.4.3
# Purpose: Modern dashboarding layer for Zenoss metrics
#
# This is a net-new service with no ControlCenter equivalent.
# Zenoss's built-in dashboarding was historically weak. Grafana provides
# a modern dashboarding layer reading from VictoriaMetrics.
#
# VictoriaMetrics datasource:
#   Provisioned automatically via ConfigMap at startup.
#   Grafana reads from http://victoriametrics.zenoss.svc.cluster.local:8428
#   using the Prometheus datasource type (VictoriaMetrics is Prometheus-compatible).
#
# Access:
#   Exposed via NodePort 30300 for browser access.
#   Default credentials: admin / admin (change on first login)
#
# Storage:
#   /var/lib/grafana — dashboards, datasources, users, plugins
#   Persistent PVC so dashboards survive pod restarts.
#
# Deployment vs StatefulSet:
#   Grafana is stateless from a clustering perspective — it stores its state
#   in the PVC, not in pod identity. A Deployment is correct here.
#   The PVC is managed separately (not via volumeClaimTemplates) since
#   Deployments don't support volumeClaimTemplates.

---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: zenoss
  labels:
    app: grafana
    tier: data
spec:
  selector:
    app: grafana
  type: NodePort
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30300   # Access via http://<server-ip>:30300

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: zenoss
  labels:
    app: grafana
    tier: data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
# Grafana datasource provisioning — auto-configures VictoriaMetrics on startup.
# Placed in /etc/grafana/provisioning/datasources/ which Grafana reads at boot.
# No manual datasource configuration needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: zenoss
  labels:
    app: grafana
    tier: data
data:
  victoriametrics.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://victoriametrics.zenoss.svc.cluster.local:8428
        isDefault: true
        editable: true
        jsonData:
          timeInterval: "30s"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: grafana-pdb
  namespace: zenoss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: grafana

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: zenoss
  labels:
    app: grafana
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        tier: data
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      securityContext:
        runAsUser: 472      # Official Grafana image runs as uid 472
        runAsGroup: 472
        fsGroup: 472        # Ensures PVC is writable by Grafana process

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: grafana
                topologyKey: kubernetes.io/hostname

      containers:
        - name: grafana
          image: grafana/grafana:10.4.3
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"   # Change on first login
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Disable analytics/telemetry
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
