# ZooKeeper — Tier 02: Data
#
# Source: zenoss/hbase:24.0.8
# CC Command: /usr/bin/run-zk.sh /etc/zookeeper.cfg
# CC Instances: Min 1, Max 1
# CC RAMCommitment: 256M
# CC Volume: /var/lib/zookeeper/version-2 (data only, not full /var/lib/zookeeper)
#
# Key translation decisions:
# - myid file: CC injected this as a ConfigFile into /var/lib/zookeeper/myid.
#   Since the PVC mounts at /var/lib/zookeeper, we write myid via initContainer
#   before the main container starts, ensuring the file lands on the PVC.
# - zoo.cfg: Pre-rendered in zenoss-config ConfigMap (zookeeper.cfg key).
#   Config-init initContainer writes it to /etc/zookeeper.cfg on an emptyDir
#   shared with the main container, matching CC's injection approach.
# - clientPort is 2181 (single instance — no InstanceID offset needed).
# - server.N entries in zoo.cfg: Scale-ready with all 3 potential pod hostnames
#   using headless service DNS. Single-node mode works with 1 server entry.
# - Privileged: true per CC manifest — ZK image needs this for bind mount setup.
# - No Prereqs in CC — ZooKeeper has no upstream dependencies.

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: zenoss
  labels:
    app: zookeeper
    tier: data
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: peer
      port: 2888
      targetPort: 2888
    - name: leader-election
      port: 3888
      targetPort: 3888
  clusterIP: None   # Headless — required for per-pod DNS and ZK clustering

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
  namespace: zenoss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: zookeeper

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: zenoss
  labels:
    app: zookeeper
    tier: data
spec:
  serviceName: zookeeper   # Must match headless Service name above
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        tier: data
    spec:
      securityContext:
        runAsUser: 0    # CC: Privileged, runs as root per image expectation
      terminationGracePeriodSeconds: 30

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zookeeper
                topologyKey: kubernetes.io/hostname

      initContainers:
        # Write zoo.cfg from ConfigMap to /etc/zookeeper.cfg
        # CC injected this via its template engine; we do it explicitly.
        - name: config-init
          image: zenoss/hbase:24.0.8
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Writing zookeeper.cfg..."
              cp /config/zookeeper.cfg /etc/zookeeper.cfg
              chown zookeeper:zookeeper /etc/zookeeper.cfg
              chmod 0664 /etc/zookeeper.cfg
              echo "Config written successfully."
          volumeMounts:
            - name: config-source
              mountPath: /config
            - name: zoo-config
              mountPath: /etc

        # Write myid file onto the PVC.
        # CC injected myid as a ConfigFile: content = "{{ plus 1 .InstanceID }}"
        # For pod zookeeper-0: InstanceID=0, so myid=1
        # Must run after the PVC is mounted so the file lands in persistent storage.
        - name: myid-init
          image: zenoss/hbase:24.0.8
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # Extract ordinal from hostname (zookeeper-0 -> 0)
              ORDINAL=$(hostname | grep -o '[0-9]*$')
              MYID=$((ORDINAL + 1))
              echo "Pod ordinal: ${ORDINAL}, ZooKeeper myid: ${MYID}"
              echo "${MYID}" > /var/lib/zookeeper/myid
              chown zookeeper:zookeeper /var/lib/zookeeper/myid
              chmod 0664 /var/lib/zookeeper/myid
              echo "myid file written: $(cat /var/lib/zookeeper/myid)"
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper

      containers:
        - name: zookeeper
          image: zenoss/hbase:24.0.8
          # CC Command: /usr/bin/run-zk.sh /etc/zookeeper.cfg
          command: ["/usr/bin/run-zk.sh", "/etc/zookeeper.cfg"]
          securityContext:
            privileged: true    # CC Privileged: true
          resources:
            requests:
              memory: "256Mi"   # CC RAMCommitment: 256M
              cpu: "100m"       # CC CPUCommitment: 1 (we use 100m for single-node)
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - name: client
              containerPort: 2181
            - name: peer
              containerPort: 2888
            - name: leader-election
              containerPort: 3888
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper
            - name: zoo-config
              mountPath: /etc/zookeeper.cfg
              subPath: zookeeper.cfg
          readinessProbe:
            # CC HealthCheck: echo stats | nc 127.0.0.1 2181 | grep -q Zookeeper
            exec:
              command:
                - /bin/sh
                - -c
                - "echo stats | nc 127.0.0.1 2181 | grep -q Zookeeper"
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "echo stats | nc 127.0.0.1 2181 | grep -q Zookeeper"
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5

      volumes:
        - name: config-source
          configMap:
            name: zenoss-config
            items:
              - key: zookeeper.cfg
                path: zookeeper.cfg
        - name: zoo-config
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi   # CC persisted /var/lib/zookeeper/version-2 only;
                            # 10Gi is generous for a single ZK node's data
