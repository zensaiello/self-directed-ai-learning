# Solr — Tier 01: Infrastructure
#
# Image: solr:8.6 (official Apache Solr image)
# Previous image: zenoss/core_6.3:6.3.2_1 (replaced)
#
# Reason for image change:
#   The zenoss/core_6.3 image ships a stripped-down Solr 6.5 installation
#   missing the Jetty ZooKeeper module. See TIER-01-INFRASTRUCTURE-COMPLETE.md.
#
# SolrCloud mode:
#   Zenoss's solrcloudpy library requires SolrCloud mode — it uses the
#   /solr/zookeeper endpoint which is only available in SolrCloud mode.
#   The official solr:8.6 image does not include embedded ZooKeeper jars,
#   so an external ZooKeeper is required (see zookeeper.yaml).
#
# Startup sequence:
#   1. fix-permissions initContainer: sets PVC ownership to uid 8983 (solr)
#   2. copy-configset initContainer: copies zenoss_model from zenoss/core_6.3
#      into a shared emptyDir
#   3. wait-for-zookeeper initContainer: waits for ZK to be ready
#   4. upload-configset initContainer: uploads zenoss_model configset to
#      ZooKeeper using 'solr zk upconfig'. This only runs if the configset
#      is not already in ZK (idempotent).
#   5. Main container: starts Solr in SolrCloud mode with solr-fg -c
#   6. postStart lifecycle hook: creates the zenoss_model collection via
#      the Collections API if it doesn't already exist.
#
# ZooKeeper: zookeeper.zenoss.svc.cluster.local:2181
# zenoss_model configset: copied from zenoss/core_6.3 at /opt/solr/server/solr/configsets/zenoss_model

---
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: zenoss
  labels:
    app.kubernetes.io/name: solr
    app.kubernetes.io/part-of: zenoss
    tier: infrastructure
spec:
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: http
      port: 8983
      targetPort: 8983

---
apiVersion: v1
kind: Service
metadata:
  name: solr-headless
  namespace: zenoss
  labels:
    app.kubernetes.io/name: solr
    app.kubernetes.io/part-of: zenoss
    tier: infrastructure
spec:
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: http
      port: 8983
      targetPort: 8983
  clusterIP: None

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: solr-pdb
  namespace: zenoss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solr

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: solr
    tier: infrastructure
spec:
  serviceName: solr-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: solr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solr
        app.kubernetes.io/part-of: zenoss
        tier: infrastructure
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: solr
                topologyKey: kubernetes.io/hostname

      initContainers:
        # -----------------------------------------------------------------------
        # fix-permissions
        # PVC is created owned by root. Official solr image runs as uid 8983.
        # -----------------------------------------------------------------------
        - name: fix-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /var/solr/data /var/solr/logs
              chown -R 8983:8983 /var/solr
              echo "Permissions set for uid 8983 (solr)"
          volumeMounts:
            - name: data
              mountPath: /var/solr

        # -----------------------------------------------------------------------
        # copy-configset
        # Copies the zenoss_model configset from zenoss/core_6.3 into a shared
        # emptyDir. The upload-configset initContainer reads from here.
        # Source: /opt/solr/server/solr/configsets/zenoss_model/conf/
        # Files: schema.xml, solrconfig.xml
        # -----------------------------------------------------------------------
        - name: copy-configset
          image: zenoss/core_6.3:6.3.2_1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              mkdir -p /configset/conf
              cp /opt/solr/server/solr/configsets/zenoss_model/conf/schema.xml \
                 /configset/conf/schema.xml
              cp /opt/solr/server/solr/configsets/zenoss_model/conf/solrconfig.xml \
                 /configset/conf/solrconfig.xml
              echo "Configset copied:"
              ls -la /configset/conf/
          volumeMounts:
            - name: configset
              mountPath: /configset

        # -----------------------------------------------------------------------
        # wait-for-zookeeper
        # Waits for ZooKeeper to be ready before attempting configset upload.
        # -----------------------------------------------------------------------
        - name: wait-for-zookeeper
          image: solr:6.6
          command:
            - /bin/bash
            - -c
            - |
              echo "Waiting for ZooKeeper..."
              until echo ruok | nc -w 2 zookeeper.zenoss.svc.cluster.local 2181 | grep -q imok; do
                echo "ZooKeeper not ready, retrying in 5s..."
                sleep 5
              done
              echo "ZooKeeper is ready."

        # -----------------------------------------------------------------------
        # upload-configset
        # Uploads the zenoss_model configset to ZooKeeper using solr zk upconfig.
        # This makes the configset available for collection creation in SolrCloud.
        # Idempotent: re-uploading an existing configset just updates it.
        # -----------------------------------------------------------------------
        - name: upload-configset
          image: solr:6.6
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Uploading zenoss_model configset to ZooKeeper..."
              solr zk upconfig \
                -n zenoss_model \
                -d /configset/conf \
                -z zookeeper.zenoss.svc.cluster.local:2181
              echo "Configset uploaded successfully."
          volumeMounts:
            - name: configset
              mountPath: /configset

      containers:
        - name: solr
          image: solr:6.6
          # Start Solr in SolrCloud mode pointing at external ZooKeeper.
          # Collection creation is handled by solr-create-collection-job.yaml
          # which runs after Solr is ready.
          command:
            - /bin/bash
            - -c
            - |
              /opt/docker-solr/scripts/init-var-solr
              exec solr-fg -c -z zookeeper.zenoss.svc.cluster.local:2181
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          env:
            - name: SOLR_PORT
              value: "8983"
            - name: SOLR_JAVA_MEM
              value: "-Xmx1g"
            - name: ZK_HOST
              value: "zookeeper.zenoss.svc.cluster.local:2181"
          ports:
            - name: http
              containerPort: 8983
          volumeMounts:
            - name: data
              mountPath: /var/solr
            - name: configset
              mountPath: /configset
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8983/solr/admin/collections?action=LIST > /dev/null"
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 8
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8983/solr/admin/info/system?wt=json > /dev/null"
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5

      volumes:
        - name: configset
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

