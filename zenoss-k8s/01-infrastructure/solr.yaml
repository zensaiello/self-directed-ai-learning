# =============================================================================
# Solr
# =============================================================================
# Source: ControlCenter service "Solr" under Infrastructure
# Image:  zenoss/core_6.3:6.3.2_1
# RAM:    1G   CPU: 1
# StartLevel: 1
#
# Key findings from image inspection and manifest extraction:
#   - Solr 6.5.0 at /opt/solr-6.5.0 (/opt/solr symlink)
#   - Startup command: /bin/supervisord -n -c /opt/solr/zenoss/etc/supervisor.conf
#   - supervisord manages Solr process - designed for this from the start
#   - solr.in.sh injected by ControlCenter with ZK_HOST and SOLR_JAVA_MEM
#   - Two volumes: /opt/solr/server/logs and /var/solr/data
#   - Health check: curl http://localhost:8983/solr/zenoss_model/admin/ping
#   - Depends on ZooKeeper for SolrCloud mode (/solr chroot)
#   - zenoss_model core must exist for health check to pass
#
# Translation notes:
#   - StatefulSet with volumeClaimTemplates for data and logs
#   - initContainer waits for ZooKeeper before starting Solr
#   - solr.in.sh mounted from ConfigMap with real ZooKeeper DNS
#   - supervisor.conf from image used as-is (already correct)
#   - curl available in zenoss/core_6.3 image - original health check works
#   - controlplane_consumer import omitted - CC-specific
# =============================================================================

---
# Headless Service
apiVersion: v1
kind: Service
metadata:
  name: solr-headless
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: solr
    tier: infrastructure
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: solr
      port: 8983
      targetPort: 8983

---
# ClusterIP Service
# DNS: solr.zenoss.svc.cluster.local:8983
# Matches ConfigMap: solr-host and solr-port
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: solr
    tier: infrastructure
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: solr
      port: 8983
      targetPort: 8983

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: solr-pdb
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: solr
    tier: infrastructure
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: solr

---
# StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: solr
    tier: infrastructure
spec:
  serviceName: solr-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solr
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: zenoss
        app.kubernetes.io/name: solr
        tier: infrastructure
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: solr
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

      initContainers:
        # -----------------------------------------------------------------------
        # wait-for-zookeeper
        # Solr requires ZooKeeper for SolrCloud mode. This initContainer blocks
        # startup until ZooKeeper is accepting connections on port 2181.
        # Uses the same check as the original ControlCenter prereq.
        # -----------------------------------------------------------------------
        - name: wait-for-zookeeper
          image: zenoss/core_6.3:6.3.2_1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              echo "Waiting for ZooKeeper at zookeeper.zenoss.svc.cluster.local:2181..."
              until { echo stats; sleep 1; } | \
                nc zookeeper.zenoss.svc.cluster.local 2181 | grep -q Zookeeper; do
                echo "ZooKeeper not ready - retrying in 5s..."
                sleep 5
              done
              echo "ZooKeeper is ready."

        # -----------------------------------------------------------------------
        # config-init
        # Injects our solr.in.sh with real ZooKeeper DNS into the container.
        # Replaces ControlCenter template injection of ZK_HOST and SOLR_JAVA_MEM.
        # -----------------------------------------------------------------------
        - name: config-init
          image: zenoss/core_6.3:6.3.2_1
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              cat > /opt/solr/zenoss/etc/solr.in.sh << 'SOLREOF'
              # Injected by Kubernetes ConfigMap
              # Replaces ControlCenter template injection
              ZK_HOST=zookeeper.zenoss.svc.cluster.local:2181/solr
              SOLR_JAVA_MEM="-Xmx1g"
              SOLREOF
              echo "solr.in.sh configured:"
              cat /opt/solr/zenoss/etc/solr.in.sh
          volumeMounts:
            - name: solr-config
              mountPath: /opt/solr/zenoss/etc

      containers:
        - name: solr
          image: zenoss/core_6.3:6.3.2_1
          imagePullPolicy: IfNotPresent

          # Use supervisord as designed in the ControlCenter manifest
          # supervisor.conf in image manages Solr startup correctly
          command:
            - /bin/supervisord
            - -n
            - -c
            - /opt/solr/zenoss/etc/supervisor.conf

          ports:
            - name: solr
              containerPort: 8983
              protocol: TCP

          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"

          volumeMounts:
            # Persistent data volume for Solr cores
            - name: data
              mountPath: /var/solr/data
            # Persistent logs volume
            - name: logs
              mountPath: /opt/solr/server/logs
            # Shared volume with config-init containing solr.in.sh
            - name: solr-config
              mountPath: /opt/solr/zenoss/etc

          # readinessProbe
          # Source: ControlCenter health check "answering"
          # Checks zenoss_model core ping endpoint
          # initialDelaySeconds is high - Solr takes time to initialize
          # cores and connect to ZooKeeper
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl -sf \
                    'http://localhost:8983/solr/zenoss_model/admin/ping?wt=json' \
                    | grep -q '"status":"OK"'
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  curl -sf \
                    'http://localhost:8983/solr/zenoss_model/admin/ping?wt=json' \
                    | grep -q '"status":"OK"'
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

      volumes:
        # emptyDir shared between config-init and main container
        # config-init writes solr.in.sh, main container reads it
        - name: solr-config
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: zenoss
          app.kubernetes.io/name: solr
          tier: infrastructure
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: logs
        labels:
          app.kubernetes.io/part-of: zenoss
          app.kubernetes.io/name: solr
          tier: infrastructure
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
