# Solr — Tier 01: Infrastructure
#
# Image: solr:8.11 (official Apache Solr image)
# Previous image: zenoss/core_6.3:6.3.2_1 (replaced)
#
# Reason for image change:
#   The zenoss/core_6.3 image ships a stripped-down Solr 6.5 installation
#   missing the Jetty ZooKeeper module required for embedded ZK startup.
#   The -DzkRun JVM flag has no effect without that module. The official
#   solr:8.11 image is a clean, maintained Solr installation with embedded
#   ZooKeeper working correctly out of the box.
#
# Key translation decisions:
# - zenoss_model configset: The only Zenoss-specific artifact needed.
#   Extracted from zenoss/core_6.3 via copy-configset initContainer into
#   an emptyDir, then mounted into the official Solr container at the
#   configsets directory. Two files: schema.xml and solrconfig.xml.
# - Collection creation: Official image provides solr-precreate which
#   creates the collection from the configset on first start, then hands
#   off to the normal Solr server. Replaces all the custom scripting
#   in the zenoss image.
# - Embedded ZooKeeper: Official image handles this correctly. No external
#   ZooKeeper dependency. No wait-for-zookeeper initContainer needed.
# - solr.in.sh: No longer needed. Official image uses environment variables
#   for JVM memory settings (SOLR_JAVA_MEM env var).
# - User: Official image runs as 'solr' uid 8983. fix-permissions
#   initContainer sets PVC ownership before main container starts.
# - Port: 8983 unchanged. All downstream DNS references unchanged.
# - SolrCloud mode: solr-precreate starts Solr in cloud mode with embedded
#   ZK automatically. No flags needed.
#
# CC source: Solr ConfigFiles["/etc/zookeeper.cfg"], Volumes, HealthChecks
# CC Command: /bin/supervisord -n -c /opt/solr/zenoss/etc/supervisor.conf
# CC supervisor.conf: setuser zenoss /opt/solr/zenoss/bin/start-solr -cloud
#   -Dbootstrap_confdir=... -Dcollection.configName=zenoss_model

---
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: zenoss
  labels:
    app.kubernetes.io/name: solr
    app.kubernetes.io/part-of: zenoss
    tier: infrastructure
spec:
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: http
      port: 8983
      targetPort: 8983

---
apiVersion: v1
kind: Service
metadata:
  name: solr-headless
  namespace: zenoss
  labels:
    app.kubernetes.io/name: solr
    app.kubernetes.io/part-of: zenoss
    tier: infrastructure
spec:
  selector:
    app.kubernetes.io/name: solr
  ports:
    - name: http
      port: 8983
      targetPort: 8983
  clusterIP: None

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: solr-pdb
  namespace: zenoss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: solr

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solr
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: solr
    tier: infrastructure
spec:
  serviceName: solr-headless
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: solr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: solr
        app.kubernetes.io/part-of: zenoss
        tier: infrastructure
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: solr
                topologyKey: kubernetes.io/hostname

      initContainers:
        # -----------------------------------------------------------------------
        # fix-permissions
        # The PVC is created by root. The official solr image runs as uid 8983.
        # This initContainer runs as root to set correct ownership on the PVC
        # before the main container starts. Runs once on first start; idempotent
        # on subsequent restarts.
        # -----------------------------------------------------------------------
        - name: fix-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -c
            - |
              chown -R 8983:8983 /var/solr
              echo "Permissions set for uid 8983 (solr)"
          volumeMounts:
            - name: data
              mountPath: /var/solr

        # -----------------------------------------------------------------------
        # copy-configset
        # Copies the zenoss_model configset from the zenoss/core_6.3 image into
        # a shared emptyDir volume. The official Solr container reads the configset
        # from this volume at startup.
        # Source: /opt/solr/server/solr/configsets/zenoss_model/conf/
        # Files: schema.xml, solrconfig.xml
        # -----------------------------------------------------------------------
        - name: copy-configset
          image: zenoss/core_6.3:6.3.2_1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              mkdir -p /configset/zenoss_model/conf
              cp /opt/solr/server/solr/configsets/zenoss_model/conf/schema.xml \
                 /configset/zenoss_model/conf/schema.xml
              cp /opt/solr/server/solr/configsets/zenoss_model/conf/solrconfig.xml \
                 /configset/zenoss_model/conf/solrconfig.xml
              echo "Configset copied:"
              ls -la /configset/zenoss_model/conf/
          volumeMounts:
            - name: configset
              mountPath: /configset

      containers:
        - name: solr
          image: solr:8.6
          # solr-precreate creates the zenoss_model collection from the configset
          # on first start, then starts the Solr server normally.
          # Syntax: solr-precreate <collection-name> <configset-path>
          command:
            - /bin/bash
            - -c
            - |
              exec solr-precreate zenoss_model /opt/solr/server/solr/configsets/zenoss_model
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          env:
            # CC RAMCommitment was not specified for Solr explicitly.
            # supervisor.conf used: -Xmx{{.RAMCommitment}} which defaults to 1g
            - name: SOLR_PORT
              value: "8983"
            - name: SOLR_JAVA_MEM
              value: "-Xmx1g"
          ports:
            - name: http
              containerPort: 8983
          volumeMounts:
            - name: data
              mountPath: /var/solr
            - name: configset
              mountPath: /opt/solr/server/solr/configsets/zenoss_model
              subPath: zenoss_model
          readinessProbe:
            # CC HealthCheck answering: curl .../ping | grep '"status":"OK"'
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8983/solr/zenoss_model/admin/ping?wt=json | grep -q '\"status\":\"OK\"'"
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "curl -sf http://localhost:8983/solr/admin/info/system?wt=json > /dev/null"
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 5

      volumes:
        - name: configset
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

