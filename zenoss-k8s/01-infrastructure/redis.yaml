# =============================================================================
# Redis
# =============================================================================
# Source: ControlCenter service "redis" under Infrastructure
# Image:  zenoss/core_6.3:6.3.2_1
# RAM:    256M   CPU: 1
# StartLevel: 1
#
# Key findings from image inspection:
#   - redis-server at /usr/bin/redis-server, started directly
#   - Default /etc/redis.conf binds to 127.0.0.1 only - must override
#     to 0.0.0.0 for cluster network accessibility
#   - No authentication configured - matches original CC deployment
#   - RDB persistence via save directives writes to /var/lib/redis/dump.rdb
#   - No pre-baked data - empty PVC is correct starting state
#   - Health check: redis-cli ping | grep -q PONG
#
# Translation notes:
#   - StatefulSet with volumeClaimTemplate for /var/lib/redis
#   - redis.conf mounted from ConfigMap with bind override
#   - No initContainer needed - no data bootstrapping required
#   - No RBAC or auth - matches original deployment posture
#   - controlplane_consumer import omitted - CC-specific
# =============================================================================

---
# ConfigMap for redis.conf
# Source: /etc/redis.conf from zenoss/core_6.3:6.3.2_1
# Key change from image default: bind 0.0.0.0 instead of 127.0.0.1
# All other settings preserved from original Zenoss configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: redis
    tier: infrastructure
data:
  redis.conf: |
    #---------------------------------------------------------------------------
    # Zenoss Redis Configuration
    # Source: zenoss/core_6.3:6.3.2_1 /etc/redis.conf
    # Managed via Kubernetes ConfigMap - edit here, restart pod to apply
    # Key change: bind 0.0.0.0 (was 127.0.0.1) for cluster accessibility
    #---------------------------------------------------------------------------

    # Bind to all interfaces so other pods can connect via ClusterDNS
    # Original: bind 127.0.0.1
    bind 0.0.0.0

    protected-mode no
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300

    daemonize no
    supervised no
    pidfile /var/run/redis_6379.pid

    loglevel notice
    # Log to stdout so kubectl logs works
    logfile ""

    databases 16

    # RDB persistence - saves snapshots to /var/lib/redis/dump.rdb
    # Ensures metric buffer data survives pod restarts
    save 900 1
    save 300 10
    save 60 10000

    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /var/lib/redis

    slave-serve-stale-data yes
    slave-read-only yes
    repl-diskless-sync no
    repl-diskless-sync-delay 5
    repl-disable-tcp-nodelay no
    slave-priority 100

    appendonly no
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes

    lua-time-limit 5000
    slowlog-log-slower-than 10000
    slowlog-max-len 128
    latency-monitor-threshold 0
    notify-keyspace-events ""

    hash-max-ziplist-entries 512
    hash-max-ziplist-value 64
    list-max-ziplist-size -2
    list-compress-depth 0
    set-max-intset-entries 512
    zset-max-ziplist-entries 128
    zset-max-ziplist-value 64
    hll-sparse-max-bytes 3000

    activerehashing yes
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit slave 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60
    hz 10
    aof-rewrite-incremental-fsync yes

---
# Headless Service for stable per-pod DNS
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: redis
    tier: infrastructure
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
# ClusterIP Service
# DNS: redis.zenoss.svc.cluster.local:6379
# Matches ConfigMap: redis-host and redis-port
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: redis
    tier: infrastructure
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: redis
    tier: infrastructure
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: redis

---
# StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: redis
    tier: infrastructure
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: zenoss
        app.kubernetes.io/name: redis
        tier: infrastructure
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: redis
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30

      containers:
        - name: redis
          image: zenoss/core_6.3:6.3.2_1
          imagePullPolicy: IfNotPresent

          # Start redis-server with our ConfigMap-mounted config file
          # --include not needed - we mount directly over /etc/redis.conf
          command:
            - redis-server
            - /etc/redis.conf

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          # Requests match ControlCenter RAMCommitment (256M, 1 CPU)
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

          volumeMounts:
            # Persistent data volume for RDB snapshots
            - name: data
              mountPath: /var/lib/redis
            # redis.conf from ConfigMap with bind 0.0.0.0 override
            - name: config
              mountPath: /etc/redis.conf
              subPath: redis.conf
              readOnly: true

          # readinessProbe
          # Source: ControlCenter health check "redis_answering"
          # Original: redis-cli ping | grep -q PONG
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          # livenessProbe
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - redis-cli ping | grep -q PONG
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

      volumes:
        - name: config
          configMap:
            name: redis-config

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: zenoss
          app.kubernetes.io/name: redis
          tier: infrastructure
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
