# =============================================================================
# Memcached + Memcached-Session
# =============================================================================
# Source: ControlCenter services "memcached" and "memcached-session"
# Image:  memcached:1.6-alpine (official Docker Hub image)
# RAM:    3G (memcached) / 1G (memcached-session)   CPU: 1
# StartLevel: 1
#
# Image decision rationale:
#   The zenoss/core_6.3 image ships memcached 1.4.15 which was designed to
#   run under ControlCenter's serviced-controller as PID 1. When run directly
#   in Kubernetes it accepts connections but returns no data - a known behavior
#   of this binary outside its original execution context.
#
#   Memcached has no Zenoss-specific code. The official memcached:1.6-alpine
#   image is the correct choice - purpose-built, maintained, and used by the
#   Zenoss community for containerized deployments (see docker-zenoss4 project).
#   This follows the Zenoss 6.6 architecture which split services into dedicated
#   images (zenoss/mariadb-core etc.) for exactly this reason.
#
# Key facts:
#   - memcached: ZODB object cache (zodb-cacheservers in global.conf)
#   - memcached-session: Zope session storage (separate service by design)
#   - No persistent storage - pure in-memory cache, cold start is normal
#   - Health check: echo stats | nc 127.0.0.1 11211 | grep -q uptime
#   - Both instances identical config, different cache sizes
#
# Translation notes:
#   - Deployment not StatefulSet - stateless by design
#   - No initContainer needed - standard image, clean startup
#   - No PVC - cold start on restart handled by Zenoss automatically
#   - controlplane_consumer import omitted - CC-specific
# =============================================================================

---
# ClusterIP Service for main Memcached
# DNS: memcached.zenoss.svc.cluster.local:11211
# Matches ConfigMap: zodb-cacheservers and memcached-host
apiVersion: v1
kind: Service
metadata:
  name: memcached
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: memcached
    tier: infrastructure
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memcached
  ports:
    - name: memcached
      port: 11211
      targetPort: 11211

---
# PodDisruptionBudget for memcached
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memcached-pdb
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: memcached
    tier: infrastructure
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached

---
# Deployment for main Memcached
# Uses official memcached:1.6-alpine image - purpose-built, no PID 1 issues
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: memcached
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: zenoss
        app.kubernetes.io/name: memcached
        tier: infrastructure
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: memcached
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 10

      containers:
        - name: memcached
          # Official memcached image - single purpose, correct PID 1 behavior
          # 1.6-alpine chosen for smaller image size and current security patches
          image: memcached:1.6-alpine
          imagePullPolicy: IfNotPresent

          # -m 1024  cache size in MB for ZODB object cache
          # -c 1024  max simultaneous connections
          # -v       verbose logging to stdout for kubectl logs
          command:
            - memcached
            - -m
            - "1024"
            - -c
            - "1024"
            - -v

          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP

          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"

          # readinessProbe using original ControlCenter health check
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  echo stats | nc 127.0.0.1 11211 | grep -q uptime
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  echo stats | nc 127.0.0.1 11211 | grep -q uptime
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

---
# =============================================================================
# Memcached Session - dedicated instance for Zope session storage
# =============================================================================

---
# ClusterIP Service for Memcached Session
# DNS: memcached-session.zenoss.svc.cluster.local:11211
apiVersion: v1
kind: Service
metadata:
  name: memcached-session
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: memcached-session
    tier: infrastructure
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memcached-session
  ports:
    - name: memcached
      port: 11211
      targetPort: 11211

---
# PodDisruptionBudget for memcached-session
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memcached-session-pdb
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: memcached-session
    tier: infrastructure
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached-session

---
# Deployment for Memcached Session
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memcached-session
  namespace: zenoss
  labels:
    app.kubernetes.io/part-of: zenoss
    app.kubernetes.io/name: memcached-session
    tier: infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memcached-session
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: zenoss
        app.kubernetes.io/name: memcached-session
        tier: infrastructure
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: memcached-session
                topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 10

      containers:
        - name: memcached-session
          image: memcached:1.6-alpine
          imagePullPolicy: IfNotPresent

          # Session cache sized at 256MB - sessions are small objects
          # Increase if Zope reports session storage errors
          command:
            - memcached
            - -m
            - "256"
            - -c
            - "1024"
            - -v

          ports:
            - name: memcached
              containerPort: 11211
              protocol: TCP

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  echo stats | nc 127.0.0.1 11211 | grep -q uptime
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  echo stats | nc 127.0.0.1 11211 | grep -q uptime
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
