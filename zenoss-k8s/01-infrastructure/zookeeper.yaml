# ZooKeeper — Tier 01: Infrastructure (Solr coordination)
#
# Image: zookeeper:3.8 (official Apache ZooKeeper image)
# Purpose: Coordination service required by Solr in SolrCloud mode
#
# Why this exists:
#   The official solr:8.6 Docker image does not include ZooKeeper jars.
#   The -DzkRun flag (embedded ZK) is present in the startup script but
#   is a no-op — the ZooKeeper classes are not on the classpath.
#   Solr in SolrCloud mode requires an external ZooKeeper.
#   This is the correct production architecture anyway.
#
# Scope: This ZooKeeper is solely for Solr coordination.
#   It is NOT the HBase ZooKeeper (that stack was replaced by VictoriaMetrics).
#   Solr uses ZK to store collection configs, cluster state, and leader election.
#
# Single node: One replica is sufficient for a single Solr node deployment.
#   Scale to 3 replicas for production HA (update zoo.cfg server entries).
#
# Port: 2181 (standard ZooKeeper client port)
# Storage: Persistent - /data and /datalog

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: zenoss
  labels:
    app: zookeeper
    tier: infrastructure
spec:
  selector:
    app: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: 2181
    - name: peer
      port: 2888
      targetPort: 2888
    - name: leader-election
      port: 3888
      targetPort: 3888
  clusterIP: None   # Headless for stable per-pod DNS

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zookeeper-pdb
  namespace: zenoss
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: zookeeper

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  namespace: zenoss
  labels:
    app: zookeeper
    tier: infrastructure
spec:
  serviceName: zookeeper
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
        tier: infrastructure
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zookeeper
                topologyKey: kubernetes.io/hostname

      containers:
        - name: zookeeper
          image: zookeeper:3.8
          env:
            - name: ZOO_MY_ID
              value: "1"
            - name: ZOO_SERVERS
              value: "server.1=zookeeper-0.zookeeper.zenoss.svc.cluster.local:2888:3888;2181"
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "mntr,conf,ruok,stat"
            - name: ZOO_MAX_CLIENT_CNXNS
              value: "60"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - name: client
              containerPort: 2181
            - name: peer
              containerPort: 2888
            - name: leader-election
              containerPort: 3888
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datalog
              mountPath: /datalog
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "echo ruok | nc -w 2 localhost 2181 | grep -q imok"
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "echo ruok | nc -w 2 localhost 2181 | grep -q imok"
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: datalog
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

