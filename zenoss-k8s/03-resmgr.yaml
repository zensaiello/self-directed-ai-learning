# Tier 03 — Resource Manager
# Services: zeneventserver, zeneventd, zenhub, zenjobs
#
# Apply order matters — each service waits for its prereqs via initContainers,
# but apply in dependency order to avoid unnecessary initContainer spin-wait:
#   kubectl apply -f 03-resmgr/resmgr.yaml
#
# Dependency chain:
#   MariaDB, Redis, RabbitMQ (Tier 01) → zeneventserver
#   zeneventserver + RabbitMQ          → zeneventd
#   MariaDB + Redis + ZEP + Solr       → zenhub
#   zenhub + MariaDB                   → zenjobs

---
# ============================================================
# zeneventserver (ZEP — Zenoss Event Processor)
# CC: RAMCommitment 256M, CPUCommitment 2, Instances 1
# Exports: port 8084 (HTTP API)
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zeneventserver
  namespace: zenoss
  labels:
    app: zeneventserver
    tier: resmgr
spec:
  serviceName: zeneventserver-headless
  replicas: 1
  selector:
    matchLabels:
      app: zeneventserver
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: zeneventserver
        tier: resmgr
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1337
        runAsGroup: 1337
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zeneventserver
                topologyKey: kubernetes.io/hostname
      initContainers:
        # Wait for MariaDB — prereq from CC manifest:
        # ZenDB.py --usedb zep --execsql=";"
        - name: wait-for-mariadb
          image: zenoss/core_6.3:6.3.2_1
          command:
            - sh
            - -c
            - |
              echo "Waiting for MariaDB (zenoss_zep database)..."
              until mysql -h mariadb.zenoss.svc.cluster.local \
                          -u zenoss -pzenoss \
                          zenoss_zep -e "SELECT 1" >/dev/null 2>&1; do
                echo "  MariaDB not ready, retrying in 5s..."
                sleep 5
              done
              echo "MariaDB ready."
          securityContext:
            runAsUser: 0
        # Wait for RabbitMQ AMQP port
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ AMQP port 5672..."
              until nc -z rabbitmq.zenoss.svc.cluster.local 5672 2>/dev/null; do
                echo "  RabbitMQ not ready, retrying in 5s..."
                sleep 5
              done
              echo "RabbitMQ ready."
        # Wait for Redis
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for Redis..."
              until redis-cli -h redis.zenoss.svc.cluster.local ping 2>/dev/null | grep -q PONG; do
                echo "  Redis not ready, retrying in 5s..."
                sleep 5
              done
              echo "Redis ready."
      containers:
        - name: zeneventserver
          image: zenoss/core_6.3:6.3.2_1
          # CC Command: su - zenoss -c "export DEFAULT_ZEP_JVM_ARGS=... && zeneventserver run_quiet"
          # runAsUser: 1337 (zenoss) set at pod level — call daemon directly
          command:
            - /bin/bash
            - -c
            - |
              export DEFAULT_ZEP_JVM_ARGS='-server -Xmx256m -Dzep.redis.host=redis.zenoss.svc.cluster.local -Dzep.redis.port=6379'
              exec /opt/zenoss/bin/zeneventserver run_quiet
          env:
            - name: ZENHOME
              value: /opt/zenoss
            - name: ZENOSS_DAEMON
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "2000m"
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          volumeMounts:
            - name: global-conf
              mountPath: /opt/zenoss/etc/global.conf
              subPath: global.conf
            - name: zeneventserver-data
              mountPath: /opt/zenoss/var/zeneventserver
            - name: logs
              mountPath: /opt/zenoss/log
          readinessProbe:
            # CC HealthCheck "answering": curl .../heartbeats/
            httpGet:
              path: /zeneventserver/api/1.0/heartbeats/
              port: 8084
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /zeneventserver/api/1.0/heartbeats/
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: global-conf
          configMap:
            name: zenoss-config
            items:
              - key: global.conf
                path: global.conf
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: zeneventserver-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zeneventserver-pdb
  namespace: zenoss
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: zeneventserver

---
apiVersion: v1
kind: Service
metadata:
  name: zeneventserver
  namespace: zenoss
  labels:
    app: zeneventserver
    tier: resmgr
spec:
  selector:
    app: zeneventserver
  ports:
    - name: http
      port: 8084
      targetPort: 8084
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: zeneventserver-headless
  namespace: zenoss
  labels:
    app: zeneventserver
    tier: resmgr
spec:
  clusterIP: None
  selector:
    app: zeneventserver
  ports:
    - name: http
      port: 8084
      targetPort: 8084

---
# ============================================================
# zeneventd — Event processing daemon
# CC: RAMCommitment 256M, CPUCommitment 1, Instances 1..N
# No exported ports — connects outbound to ZEP + RabbitMQ
# Deployment (stateless — no stable identity or persistent data required)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeneventd
  namespace: zenoss
  labels:
    app: zeneventd
    tier: resmgr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zeneventd
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: zeneventd
        tier: resmgr
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1337
        runAsGroup: 1337
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zeneventd
                topologyKey: kubernetes.io/hostname
      initContainers:
        # Wait for zeneventserver to be answering
        - name: wait-for-zeneventserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for zeneventserver heartbeat..."
              until wget -qO- \
                http://zeneventserver.zenoss.svc.cluster.local:8084/zeneventserver/api/1.0/heartbeats/ \
                >/dev/null 2>&1; do
                echo "  ZEP not ready, retrying in 5s..."
                sleep 5
              done
              echo "zeneventserver ready."
        # Wait for RabbitMQ AMQP port
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for RabbitMQ AMQP port 5672..."
              until nc -z rabbitmq.zenoss.svc.cluster.local 5672 2>/dev/null; do
                echo "  RabbitMQ not ready, retrying in 5s..."
                sleep 5
              done
              echo "RabbitMQ ready."
      containers:
        - name: zeneventd
          image: zenoss/core_6.3:6.3.2_1
          # CC Command: su - zenoss -c "nice -n 10 zeneventd run -c --logfileonly"
          command:
            - /bin/bash
            - -c
            - |
              exec /usr/bin/nice -n 10 /opt/zenoss/bin/zeneventd run -c --logfileonly
          env:
            - name: ZENHOME
              value: /opt/zenoss
            - name: ZENOSS_DAEMON
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: global-conf
              mountPath: /opt/zenoss/etc/global.conf
              subPath: global.conf
            - name: logs
              mountPath: /opt/zenoss/log
          readinessProbe:
            # CC HealthCheck "running": pgrep zeneventd.py
            exec:
              command:
                - pgrep
                - -f
                - zeneventd.py
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - zeneventd.py
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: global-conf
          configMap:
            name: zenoss-config
            items:
              - key: global.conf
                path: global.conf
        - name: logs
          emptyDir: {}

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zeneventd-pdb
  namespace: zenoss
spec:
  minAvailable: 0
  selector:
    matchLabels:
      app: zeneventd

---
# ============================================================
# zenhub — Central hub service
# CC: RAMCommitment 256M, CPUCommitment 1, Instances 1
# Exports: 8789 (PB/Twisted), 8081 (XML-RPC)
# Prereqs: MariaDB, Solr
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zenhub
  namespace: zenoss
  labels:
    app: zenhub
    tier: resmgr
spec:
  serviceName: zenhub-headless
  replicas: 1
  selector:
    matchLabels:
      app: zenhub
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: zenhub
        tier: resmgr
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1337
        runAsGroup: 1337
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zenhub
                topologyKey: kubernetes.io/hostname
      initContainers:
        # Wait for MariaDB (zodb database)
        - name: wait-for-mariadb
          image: zenoss/core_6.3:6.3.2_1
          command:
            - sh
            - -c
            - |
              echo "Waiting for MariaDB (zodb)..."
              until mysql -h mariadb.zenoss.svc.cluster.local \
                          -u zenoss -pzenoss \
                          zodb -e "SELECT 1" >/dev/null 2>&1; do
                echo "  MariaDB not ready, retrying in 5s..."
                sleep 5
              done
              echo "MariaDB ready."
          securityContext:
            runAsUser: 0
        # Wait for Solr zenoss_model collection
        - name: wait-for-solr
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Solr zenoss_model collection..."
              until wget -qO- \
                "http://solr.zenoss.svc.cluster.local:8983/solr/zenoss_model/admin/ping?wt=json" \
                2>/dev/null | grep -q '"status":"OK"'; do
                echo "  Solr not ready, retrying in 5s..."
                sleep 5
              done
              echo "Solr ready."
        # Wait for zeneventserver
        - name: wait-for-zeneventserver
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for zeneventserver..."
              until wget -qO- \
                http://zeneventserver.zenoss.svc.cluster.local:8084/zeneventserver/api/1.0/heartbeats/ \
                >/dev/null 2>&1; do
                echo "  ZEP not ready, retrying in 5s..."
                sleep 5
              done
              echo "zeneventserver ready."
        # Wait for Redis
        - name: wait-for-redis
          image: redis:7-alpine
          command:
            - sh
            - -c
            - |
              until redis-cli -h redis.zenoss.svc.cluster.local ping 2>/dev/null | grep -q PONG; do
                echo "  Redis not ready, retrying in 5s..."
                sleep 5
              done
              echo "Redis ready."
      containers:
        - name: zenhub
          image: zenoss/core_6.3:6.3.2_1
          # CC Command: su - zenoss -c "zenhub run -c --logfileonly --monitor <parent.Name>"
          # The --monitor flag takes the ControlCenter service name; use "localhost" as the
          # default monitor name for the hub identifier (matches zenhub.conf default).
          command:
            - /bin/bash
            - -c
            - |
              exec /opt/zenoss/bin/zenhub run -c --logfileonly --monitor localhost
          env:
            - name: ZENHOME
              value: /opt/zenoss
            - name: ZENOSS_DAEMON
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1000m"
          ports:
            - name: pb
              containerPort: 8789
              protocol: TCP
            - name: xmlrpc
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: global-conf
              mountPath: /opt/zenoss/etc/global.conf
              subPath: global.conf
            - name: logs
              mountPath: /opt/zenoss/log
          readinessProbe:
            # CC HealthCheck "rpc_listening": port 8081 open
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 9
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: global-conf
          configMap:
            name: zenoss-config
            items:
              - key: global.conf
                path: global.conf
        - name: logs
          emptyDir: {}

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zenhub-pdb
  namespace: zenoss
