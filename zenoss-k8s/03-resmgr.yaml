# ============================================================
# zenjobs — Background job scheduler
# CC: RAMCommitment 256M, CPUCommitment 1, Instances 1..N
# No exported ports — connects outbound to zenhub + MariaDB
# Deployment (stateless — no stable identity or persistent data required)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenjobs
  namespace: zenoss
  labels:
    app: zenjobs
    tier: resmgr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zenjobs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: zenjobs
        tier: resmgr
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1337
        runAsGroup: 1337
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: zenjobs
                topologyKey: kubernetes.io/hostname
      initContainers:
        # Wait for zenhub PB port
        - name: wait-for-zenhub
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for zenhub port 8789..."
              until nc -z zenhub.zenoss.svc.cluster.local 8789 2>/dev/null; do
                echo "  zenhub not ready, retrying in 5s..."
                sleep 5
              done
              echo "zenhub ready."
        # Wait for MariaDB
        - name: wait-for-mariadb
          image: zenoss/core_6.3:6.3.2_1
          command:
            - sh
            - -c
            - |
              until mysql -h mariadb.zenoss.svc.cluster.local \
                          -u zenoss -pzenoss \
                          zodb -e "SELECT 1" >/dev/null 2>&1; do
                echo "  MariaDB not ready, retrying in 5s..."
                sleep 5
              done
              echo "MariaDB ready."
          securityContext:
            runAsUser: 0
      containers:
        - name: zenjobs
          image: zenoss/core_6.3:6.3.2_1
          # CC Command: su - zenoss -c "zenjobs run --logfileonly"
          command:
            - /bin/bash
            - -c
            - |
              exec /opt/zenoss/bin/zenjobs run --logfileonly
          env:
            - name: ZENHOME
              value: /opt/zenoss
            - name: ZENOSS_DAEMON
              value: "1"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: global-conf
              mountPath: /opt/zenoss/etc/global.conf
              subPath: global.conf
            - name: logs
              mountPath: /opt/zenoss/log
          readinessProbe:
            # CC HealthCheck "running": pgrep zenjobs.py
            exec:
              command:
                - pgrep
                - -f
                - zenjobs.py
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - zenjobs.py
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: global-conf
          configMap:
            name: zenoss-config
            items:
              - key: global.conf
                path: global.conf
        - name: logs
          emptyDir: {}

