apiVersion: v1
kind: Pod
metadata:
  name: cart-session
  labels:
    app: cart-session
spec:
  containers:
    - name: cart
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /session-data/activity.log; sleep 5; done"]
      volumeMounts:
        - name: session-storage
          mountPath: /session-data
  volumes:
    - name: session-storage
      emptyDir: {}
