apiVersion: v1
kind: Service
metadata:
  name: product-catalog-lb
  labels:
    app: product-catalog
spec:
  type: LoadBalancer
  selector:
    app: product-catalog
  ports:
    - port: 80
      targetPort: 5678
      protocol: TCP
