kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ecommerce-lab
nodes:
  - role: control-plane
  - role: worker
    labels:
      node-type: ingress
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
    labels:
      node-type: compute
  - role: worker
    labels:
      node-type: compute
