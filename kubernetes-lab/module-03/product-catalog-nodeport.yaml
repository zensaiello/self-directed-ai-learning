# RETIRED after Module 3 — do not apply in subsequent modules
# Purpose: demonstrated NodePort Service type and direct node IP access
# Production note: NodePort is not used for application traffic in production
# Replaced by: Ingress in module-03/product-catalog-ingress.yaml
apiVersion: v1
kind: Service
metadata:
  name: product-catalog-nodeport
  labels:
    app: product-catalog
spec:
  type: NodePort
  selector:
    app: product-catalog
  ports:
    - port: 80
      targetPort: 5678
      nodePort: 30080
      protocol: TCP
