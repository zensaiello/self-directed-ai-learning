apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-broken
  labels:
    app: postgres-broken
spec:
  serviceName: postgres-broken
  replicas: 1
  selector:
    matchLabels:
      app: postgres-broken
  template:
    metadata:
      labels:
        app: postgres-broken
    spec:
      containers:
        - name: postgres
          image: postgres:16.3
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: wrong-key
          ports:
            - containerPort: 5432
      volumes: []
